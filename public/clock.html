<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Clock - Multi-Timezone Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 25%, #7e22ce 50%, #c026d3 75%, #f43f5e 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            width: 100%;
            max-width: 1400px;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .controls input,
        .controls select,
        .controls button {
            padding: 12px 20px;
            border: 2px solid white;
            border-radius: 8px;
            font-size: 1em;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .controls input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .controls button {
            background: rgba(255, 255, 255, 0.2);
            font-weight: 600;
        }

        .controls button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .clocks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .clock-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            color: white;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            position: relative;
        }

        .clock-card:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
        }

        .clock-card.active {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 59, 48, 0.8);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2em;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .delete-btn:hover {
            background: rgba(255, 59, 48, 1);
            transform: rotate(90deg) scale(1.1);
        }

        .city-name {
            font-size: 1.3em;
            font-weight: 600;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .analog-clock {
            width: 150px;
            height: 150px;
            border: 3px solid white;
            border-radius: 50%;
            margin: 0 auto 15px;
            position: relative;
            background: rgba(0, 0, 0, 0.2);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.3);
        }

        .clock-face {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .clock-center {
            position: absolute;
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            border-radius: 10px;
        }

        .hour-hand {
            width: 6px;
            height: 45px;
            background: white;
            margin-left: -3px;
        }

        .minute-hand {
            width: 4px;
            height: 55px;
            background: rgba(255, 255, 255, 0.8);
            margin-left: -2px;
        }

        .second-hand {
            width: 2px;
            height: 60px;
            background: #ff6b6b;
            margin-left: -1px;
        }

        .digital-time {
            font-size: 2.2em;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            margin: 15px 0;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .time-info {
            display: flex;
            justify-content: space-around;
            margin-top: 10px;
            font-size: 0.9em;
            opacity: 0.9;
        }

        .time-zone {
            padding: 5px 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
        }

        .utc-offset {
            padding: 5px 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
        }

        .clock-list {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
        }

        .clock-list h3 {
            color: white;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .clock-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            margin-bottom: 8px;
            color: white;
            transition: all 0.3s ease;
        }

        .clock-list-item:hover {
            background: rgba(255, 255, 255, 0.1);
            padding-left: 15px;
        }

        .list-time {
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 1.1em;
        }

        .preset-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s ease;
            margin: 5px;
        }

        .preset-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .presets-section {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: center;
        }

        .presets-section h3 {
            color: white;
            margin-bottom: 15px;
        }

        .presets-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 2em;
            }

            .clocks-grid {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
            }

            .controls input,
            .controls select,
            .controls button {
                width: 100%;
            }

            .preset-btn {
                flex: 1;
                min-width: calc(50% - 5px);
            }
        }

        .empty-state {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            padding: 40px;
            font-size: 1.2em;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌍 World Clock</h1>
            <p>View current time across multiple time zones</p>
        </header>

        <div class="presets-section">
            <h3>Quick Add Presets</h3>
            <div class="presets-grid">
                <button class="preset-btn" onclick="addPreset('America/New_York', 'New York')">🗽 New York</button>
                <button class="preset-btn" onclick="addPreset('Europe/London', 'London')">🇬🇧 London</button>
                <button class="preset-btn" onclick="addPreset('Europe/Paris', 'Paris')">🇫🇷 Paris</button>
                <button class="preset-btn" onclick="addPreset('Asia/Tokyo', 'Tokyo')">🇯🇵 Tokyo</button>
                <button class="preset-btn" onclick="addPreset('Asia/Bangkok', 'Bangkok')">🇹🇭 Bangkok</button>
                <button class="preset-btn" onclick="addPreset('Australia/Sydney', 'Sydney')">🇦🇺 Sydney</button>
                <button class="preset-btn" onclick="addPreset('Asia/Dubai', 'Dubai')">🇦🇪 Dubai</button>
                <button class="preset-btn" onclick="addPreset('Asia/Singapore', 'Singapore')">🇸🇬 Singapore</button>
            </div>
        </div>

        <div class="controls">
            <input type="text" id="cityInput" placeholder="Enter city name..." onkeypress="handleKeyPress(event)">
            <select id="timezoneSelect">
                <option value="">Select a timezone...</option>
            </select>
            <button onclick="addClock()">➕ Add Clock</button>
            <button onclick="clearAllClocks()">🗑️ Clear All</button>
        </div>

        <div id="clocksContainer" class="clocks-grid"></div>

        <div class="clock-list">
            <h3>📋 All Times</h3>
            <div id="timeList"></div>
        </div>
    </div>

    <script>
        const timezones = [
            'UTC', 'America/New_York', 'America/Chicago', 'America/Denver', 'America/Los_Angeles',
            'America/Anchorage', 'Pacific/Honolulu', 'America/Toronto', 'America/Mexico_City',
            'America/Sao_Paulo', 'America/Buenos_Aires', 'Europe/London', 'Europe/Paris',
            'Europe/Berlin', 'Europe/Madrid', 'Europe/Rome', 'Europe/Istanbul', 'Europe/Moscow',
            'Africa/Cairo', 'Africa/Johannesburg', 'Africa/Lagos', 'Asia/Dubai', 'Asia/Kolkata',
            'Asia/Bangkok', 'Asia/Singapore', 'Asia/Hong_Kong', 'Asia/Shanghai', 'Asia/Tokyo',
            'Australia/Sydney', 'Australia/Melbourne', 'Australia/Brisbane', 'Pacific/Auckland'
        ];

        let clocks = [];

        // Populate timezone select
        function initTimezoneSelect() {
            const select = document.getElementById('timezoneSelect');
            timezones.forEach(tz => {
                const option = document.createElement('option');
                option.value = tz;
                option.textContent = tz;
                select.appendChild(option);
            });
        }

        function addPreset(timezone, cityName) {
            addClockWithTimezone(timezone, cityName);
        }

        function addClock() {
            const cityInput = document.getElementById('cityInput');
            const timezoneSelect = document.getElementById('timezoneSelect');
            
            const cityName = cityInput.value.trim();
            const timezone = timezoneSelect.value;

            if (!cityName || !timezone) {
                alert('Please enter a city name and select a timezone');
                return;
            }

            addClockWithTimezone(timezone, cityName);
            cityInput.value = '';
            timezoneSelect.value = '';
        }

        function addClockWithTimezone(timezone, cityName) {
            const clock = {
                id: Date.now(),
                timezone,
                cityName
            };

            clocks.push(clock);
            saveClocksToStorage();
            renderClocks();
        }

        function deleteClock(id) {
            clocks = clocks.filter(c => c.id !== id);
            saveClocksToStorage();
            renderClocks();
        }

        function clearAllClocks() {
            if (confirm('Are you sure you want to clear all clocks?')) {
                clocks = [];
                saveClocksToStorage();
                renderClocks();
            }
        }

        function getTimeInTimezone(timezone) {
            const now = new Date();
            const formatter = new Intl.DateTimeFormat('en-US', {
                timeZone: timezone,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });

            const parts = formatter.formatToParts(now);
            const time = {};
            parts.forEach(part => {
                if (part.type !== 'literal') {
                    time[part.type] = part.value;
                }
            });

            return {
                hour: parseInt(time.hour),
                minute: parseInt(time.minute),
                second: parseInt(time.second),
                formatted: `${time.hour}:${time.minute}:${time.second}`
            };
        }

        function getUTCOffset(timezone) {
            const now = new Date();
            const utcDate = new Date(now.toLocaleString('en-US', { timeZone: 'UTC' }));
            const tzDate = new Date(now.toLocaleString('en-US', { timeZone: timezone }));
            const offset = (tzDate - utcDate) / (1000 * 60 * 60);
            const sign = offset >= 0 ? '+' : '';
            return `${sign}${offset.toFixed(0)}:00`;
        }

        function renderClocks() {
            const container = document.getElementById('clocksContainer');
            const timeList = document.getElementById('timeList');

            if (clocks.length === 0) {
                container.innerHTML = '<div class="empty-state">Add a clock to get started! Use the presets or enter a timezone.</div>';
                timeList.innerHTML = '<div style="text-align: center; color: rgba(255,255,255,0.5);">No clocks added yet</div>';
                return;
            }

            container.innerHTML = clocks.map(clock => {
                const time = getTimeInTimezone(clock.timezone);
                const offset = getUTCOffset(clock.timezone);
                const hourDeg = (time.hour % 12) * 30 + time.minute * 0.5;
                const minuteDeg = time.minute * 6 + time.second * 0.1;
                const secondDeg = time.second * 6;

                return `
                    <div class="clock-card">
                        <button class="delete-btn" onclick="deleteClock(${clock.id})">✕</button>
                        <div class="city-name">${clock.cityName}</div>
                        <div class="analog-clock">
                            <div class="clock-face">
                                <div class="hand hour-hand" style="transform: rotate(${hourDeg}deg)"></div>
                                <div class="hand minute-hand" style="transform: rotate(${minuteDeg}deg)"></div>
                                <div class="hand second-hand" style="transform: rotate(${secondDeg}deg)"></div>
                                <div class="clock-center"></div>
                            </div>
                        </div>
                        <div class="digital-time">${time.formatted}</div>
                        <div class="time-info">
                            <div class="time-zone">🌐 ${clock.timezone}</div>
                            <div class="utc-offset">UTC ${offset}</div>
                        </div>
                    </div>
                `;
            }).join('');

            timeList.innerHTML = clocks.map(clock => {
                const time = getTimeInTimezone(clock.timezone);
                return `
                    <div class="clock-list-item">
                        <span>${clock.cityName}</span>
                        <span class="list-time">${time.formatted}</span>
                    </div>
                `;
            }).join('');
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                addClock();
            }
        }

        function saveClocksToStorage() {
            localStorage.setItem('worldClocks', JSON.stringify(clocks));
        }

        function loadClocksFromStorage() {
            const stored = localStorage.getItem('worldClocks');
            if (stored) {
                clocks = JSON.parse(stored);
            }
        }

        // Update clocks every second
        setInterval(() => {
            renderClocks();
        }, 1000);

        // Initialize
        window.addEventListener('load', () => {
            initTimezoneSelect();
            loadClocksFromStorage();
            renderClocks();
        });
    </script>
</body>
</html>
